[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forescout-kql-demo"
version = "0.1.0"
description = "A small English-to-KQL demo with Azure Data Explorer and Foundry observability."
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects>=2.11.0,<3",
    "azure-identity>=1.20,<2",
    "azure-kusto-data>=5,<7",
    "azure-monitor-opentelemetry>=1.8.12,<2",
    "fastapi>=0.115,<1",
    "openai>=3,<4",
    "opentelemetry-sdk>=1.37,<2",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "playwright>=1.50,<2", "pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
security-kql = "security_kql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_kql = ["static/*.html", "data/*.json", "queries/*.kql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
